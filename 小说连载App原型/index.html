<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#f8f8fa"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="墨间"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/app-icon.svg"><title>墨间 · 私人小说工作台</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="phone" aria-label="私人小说工作台"><section class="screen">
<header class="topbar"><div><p class="eyebrow">星期五，8 月 22 日</p><h1>继续写吧，知夏</h1></div><button class="avatar">知</button></header>
<section class="continue-card"><div class="cover cover-main">雾<br>港</div><div class="continue-copy"><p class="eyebrow">继续创作 · 已自动保存</p><h2>雾港来信</h2><p>第 26 章 · 潮汐落下之前</p><div class="progress"><i></i></div><small>1,826 字 · 完成度 68%</small></div><button class="round-play" aria-label="继续写作">✎</button></section>
<section class="today"><div class="section-title"><h2>最近章节</h2><button class="text-button">查看全部</button></div>
<article class="update-row"><div class="cover cover-yellow">夏</div><div><h3>夏日来信</h3><p>第 12 章 · 一封未寄出的信</p><span>草稿 · 1,204 字 · 3 分钟前</span></div><button class="add">›</button></article>
<article class="update-row"><div class="cover cover-blue">北</div><div><h3>北方的白鲸</h3><p>第 8 章 · 雪落无声</p><span>已完成 · 2,370 字 · 昨天</span></div><button class="add">›</button></article></section>
<section class="shelf"><div class="section-title"><h2>创作工具</h2><button class="text-button">管理</button></div><div class="books">
<article><button class="tool-card"><b>⌘</b><span>人物设定</span><small>12 个角色</small></button></article><article><button class="tool-card"><b>◈</b><span>故事时间线</span><small>6 条事件</small></button></article><article><button class="tool-card"><b>⇧</b><span>导出稿件</span><small>发布前整理</small></button></article>
</div></section>
<section class="settings-page" aria-label="设置">
  <header class="settings-header"><div><p class="eyebrow">私人创作空间</p><h1>设置</h1></div></header>
  <section class="settings-group"><p class="group-label">数据与同步</p><div class="setting-row"><div><h3>自动同步</h3><p>联网时自动备份稿件与素材</p></div><label class="switch"><input id="syncToggle" type="checkbox" checked><span></span></label></div><p id="syncStatus" class="setting-hint">已开启 · 最近同步于今天 21:18</p></section>
  <section class="settings-group"><p class="group-label">稿件管理</p><button id="exportButton" class="setting-row action-row"><div><h3>导出全部稿件</h3><p>生成 TXT 文件，便于上传平台</p></div><b>›</b></button></section>
  <section class="settings-group"><p class="group-label">关于</p><div class="setting-row"><div><h3>墨间</h3><p>私人小说工作台 · 1.0</p></div></div></section>
</section></section>
<nav class="tabbar"><button class="active" data-page="作品"><span>⌂</span>作品</button><button data-page="章节"><span>▦</span>章节</button><button data-page="素材"><span>◌</span>素材</button><button data-page="设置"><span>◯</span>设置</button></nav></main><div class="toast" role="status"></div><script src="app.js"></script></body></html>
